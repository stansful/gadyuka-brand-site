# Upstream request headers of every proxied location. The app trusts X-Real-IP / the LAST
# X-Forwarded-For address for the lead limits and the admin login throttle: both are overwritten with the
# TCP peer here, so a visitor cannot choose them. Host keeps the port the browser used (Server Actions
# compare it with Origin). Cookies and User-Agent pass through untouched.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_hide_header X-Powered-By;
