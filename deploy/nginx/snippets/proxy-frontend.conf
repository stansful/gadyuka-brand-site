# Next.js. No Accept-Encoding upstream: Next answers identity and gzip happens here (http.conf). No
# buffering: pages stream (shell first, then the dynamic parts); gzip flushes along with the upstream.
# Next's own copies of the security headers are replaced by ours (no duplicates).

proxy_pass http://gadyuka_frontend;
include /etc/gadyuka-nginx/snippets/proxy-common.conf;
proxy_set_header Accept-Encoding "";
proxy_buffering off;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
include /etc/gadyuka-nginx/snippets/security-headers.conf;
