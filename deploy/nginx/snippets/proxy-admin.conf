# The admin: Next.js like everything else, never indexed, and long timeouts — a Telegram resend can take
# up to ~50 s, a site-text save up to 45 s (shared/contracts/http.ts).

include /etc/gadyuka-nginx/snippets/proxy-frontend.conf;
add_header X-Robots-Tag "noindex, nofollow" always;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
