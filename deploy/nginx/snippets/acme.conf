# Plain-HTTP helpers of both configs: certbot's webroot challenge and the container healthcheck.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

location = /.proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
