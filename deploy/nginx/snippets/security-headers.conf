# Security headers + the baseline CSP of pages, the admin and the API (not of /media/*: the backend sends
# a stricter sandbox CSP with every media file).

include /etc/gadyuka-nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
