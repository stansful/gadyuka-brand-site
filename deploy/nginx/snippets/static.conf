# Build files from /srv/static (the location sets `root` and its Cache-Control). The .gz copy written by
# the build is sent when the client accepts gzip (Vary: Accept-Encoding); nothing is compressed on the
# fly here (files < 1 KB have no copy and go as they are). A missing file → Next (it answers 404 itself).

gzip off;
gzip_static on;
gzip_vary on;
try_files $uri @frontend;
include /etc/gadyuka-nginx/snippets/security-headers.conf;
