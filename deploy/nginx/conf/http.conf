# ГАДЮКА — http-level settings (copied to /etc/nginx/conf.d/00-http.conf by nginx-start.sh; the image's
# nginx.conf includes conf.d/*.conf inside `http { }`). Requirements: frontend/docs/COMPRESSION.md.

server_tokens off;

# Docker's DNS: upstream names are resolved again at run time (`resolve` below), so a recreated
# frontend / backend container (new IP) is found without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream gadyuka_frontend {
    zone gadyuka_frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream gadyuka_backend {
    zone gadyuka_backend 64k;
    server backend:4000 resolve;
    keepalive 8;
}

# public/brand/*: content-hashed URLs (?v=…) are cached for good, unversioned ones revalidated.
map $arg_v $gadyuka_brand_cache {
    ""      "public, max-age=0, must-revalidate";
    default "public, max-age=31536000, immutable";
}

# Dynamic responses (HTML, RSC, JSON, Server Actions) are compressed here; Next gets no Accept-Encoding
# (proxy-frontend.conf). The official image has no brotli / zstd modules: gzip 6 for everything.
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/x-component
    application/json
    application/javascript
    application/xml
    application/manifest+json
    application/rss+xml
    image/svg+xml;

# Request bodies: 2 MiB by default (Server Actions limit 1 MB, leads 16 KB); the admin media upload
# raises it in its own locations.
client_max_body_size 2m;
