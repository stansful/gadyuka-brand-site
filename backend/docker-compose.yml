# Local development services of the ГАДЮКА backend: PostgreSQL 18 + MinIO (S3 for media).
#
#   docker compose up -d        (values come from ./.env — copy .env.example first)
#
# - Ports are published on loopback only (Docker bypasses the host firewall, 0.0.0.0 would expose
#   these services to the whole LAN). They differ from the frontend's own dev services
#   (gadyuka-db on 5432, gadyuka-minio on 9000/9001), so both stacks can run side by side.
# - Data lives in host folders: ~/docker-volumes/gadyuka-dev/<service>.
# - MinIO: the official minio/minio image is no longer published; pgsty/minio is the
#   community-maintained build of the same server (pinned release). Console: http://127.0.0.1:${MINIO_CONSOLE_PORT}
# - minio-init (one-off) creates the media bucket (private: the backend serves it under /media/*)
#   and the backend's own MinIO user (S3_ACCESS_KEY_ID) with rights on that bucket only.
name: gadyuka-backend

services:
  postgres:
    container_name: gadyuka-backend-postgres
    image: postgres:18.1-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      # Postgres 18 images keep the cluster in /var/lib/postgresql/18/docker (mount the parent).
      - ~/docker-volumes/gadyuka-dev/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    container_name: gadyuka-backend-minio
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT}:9001'
    volumes:
      - ~/docker-volumes/gadyuka-dev/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    container_name: gadyuka-backend-minio-init
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        cat > /tmp/backend-policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"], "Resource": ["arn:aws:s3:::$${S3_BUCKET}"] },
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"], "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"] }
          ]
        }
        POLICY
        mc admin policy create local gadyuka-backend /tmp/backend-policy.json
        mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc admin policy attach local gadyuka-backend --user "$${S3_ACCESS_KEY_ID}" || true
