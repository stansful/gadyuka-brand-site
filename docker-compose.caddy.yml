# ГАДЮКА — reverse proxy variant 1: Caddy (automatic HTTPS from Let's Encrypt, HTTP/3).
# Used together with docker-compose.yml: `sudo ./deploy/up-caddy.sh` (readme_dev.md), afterwards plain
# `docker compose …` (COMPOSE_FILE in .env). Config: deploy/caddy/Caddyfile.
#
# The only service with published ports. Data: ${VOLUMES_DIR}/caddy/data (certificates, ACME account)
# and ${VOLUMES_DIR}/caddy/config; the frontend's static files are mounted read-only.

services:
  caddy:
    # 2.11.7 or newer: 2.10.x answers every precompressed file (`file_server precompressed`) with
    # 206 Partial Content even without a Range header (a wrong answer to a plain request).
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # 1 = also serve www.<DOMAIN> (certificate included) and redirect it to the apex (needs a DNS record).
      WWW_REDIRECT: ${WWW_REDIRECT:-0}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/caddy/data:/data
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/caddy/config:/config
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/frontend/static:/srv/static:ro
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      # The admin API answers on localhost inside the container only.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
