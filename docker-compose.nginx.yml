# ГАДЮКА — reverse proxy variant 2: nginx + certbot (Let's Encrypt, webroot challenge).
# Used together with docker-compose.yml: `sudo ./deploy/up-nginx.sh` (README.md), afterwards plain
# `docker compose …` (COMPOSE_FILE in .env). Configs and scripts: deploy/nginx/.
#
#   nginx    renders its config at start (deploy/nginx/nginx-start.sh): HTTP-only bootstrap (ACME
#            challenge + health) until a certificate exists, then the full HTTPS site; it checks the
#            certificate every 10 s and reloads when it appears or changes (renewal). Healthy only
#            in HTTPS mode, so `up --wait` returns once the site is served over HTTPS
#   certbot  keeps the certificate (deploy/nginx/certbot-loop.sh): first request with
#            `certbot certonly --webroot`, then `certbot renew` every 12 h; NGINX_TLS_MODE=self-signed
#            makes a self-signed certificate instead (local tests: `./deploy/up-nginx.sh --self-signed`)
#
# Data: ${VOLUMES_DIR}/nginx/certs (/etc/letsencrypt: account, keys, certificates) and
# ${VOLUMES_DIR}/certbot/www (challenge files). Only nginx publishes ports (80, 443).
#
# Compression: the official image has gzip_static, but not the brotli / zstd modules — precompressed
# static files are served as .gz, dynamic responses gzip 6 (the Caddy variant also serves br / zstd).

services:
  nginx:
    image: nginx:1.30.6-alpine3.24
    restart: unless-stopped
    init: true
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      WWW_REDIRECT: ${WWW_REDIRECT:-0}
      NGINX_TLS_MODE: ${NGINX_TLS_MODE:-letsencrypt}
    entrypoint: ['/bin/sh', '/etc/gadyuka-nginx/nginx-start.sh']
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/nginx:/etc/gadyuka-nginx:ro
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/nginx/certs:/etc/letsencrypt:ro
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/certbot/www:/var/www/certbot:ro
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/frontend/static:/srv/static:ro
    security_opt:
      - 'no-new-privileges:true'
    healthcheck:
      # Healthy once the HTTPS config is active (not during the HTTP-only bootstrap): `up --wait`
      # returns when the site is really served over HTTPS.
      test: ['CMD-SHELL', 'test "$$(cat /tmp/gadyuka-nginx-mode 2>/dev/null)" = https && wget -q --spider http://127.0.0.1/.proxy-health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 3s
    networks: [edge]
    logging: &proxy-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    init: true
    depends_on:
      # Started, not healthy: nginx turns healthy only after this service has the certificate.
      nginx:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      WWW_REDIRECT: ${WWW_REDIRECT:-0}
      NGINX_TLS_MODE: ${NGINX_TLS_MODE:-letsencrypt}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # 1 = Let's Encrypt staging (untrusted test certificates, generous rate limits) — for a first try.
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    entrypoint: ['/bin/sh', '/etc/gadyuka-nginx/certbot-loop.sh']
    volumes:
      - ./deploy/nginx:/etc/gadyuka-nginx:ro
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/nginx/certs:/etc/letsencrypt
      - ${VOLUMES_DIR:-~/docker-volumes/gadyuka}/certbot/www:/var/www/certbot
    security_opt:
      - 'no-new-privileges:true'
    healthcheck:
      # Healthy once the certificate exists (`up --wait` waits for the first issuance).
      test: ['CMD', 'sh', '/etc/gadyuka-nginx/certbot-health.sh']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 3s
    networks: [edge]
    logging: *proxy-logging
