# ГАДЮКА — production stack (VPS). Step-by-step guide: DEPLOY.md.
#
#   caddy       :80/:443 → automatic HTTPS for ${DOMAIN}; proxies everything to app:3000
#   app         Next.js standalone; connects as the least-privilege role APP_DB_USER (DML only);
#               streams media from MinIO under /media/* (src/app/media/[...key]/route.ts)
#   db          PostgreSQL 17 (port published on 127.0.0.1 only — used by the image build);
#               deploy/postgres/initdb creates APP_DB_USER on the first start of an empty volume
#   minio       S3 storage for media (bucket S3_BUCKET, private; not published at all — only the
#               app and tools reach it, on the compose network)
#   minio-init  one-shot on every `up`: creates the bucket and the app's own MinIO user
#               (S3_ACCESS_KEY_ID, rights on that bucket only — the app never gets the root user)
#   tools       one-off tasks (profile "tools"): migrate, seed — as the superuser POSTGRES_USER
#
# MinIO image: the official minio/minio image is no longer published; pgsty/minio is the
# community-maintained build of the same server (pinned release, includes `mc`).
#
# Variables come from .env next to this file (see DEPLOY.md, section «.env»).

name: gadyuka

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z

# S3 settings of the app and the seed (src/lib/storage/config.ts). MinIO is reached by service name.
x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-gadyuka-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: '1'
  # Never the MinIO root user (env_file would pass it through).
  MINIO_ROOT_USER: ''
  MINIO_ROOT_PASSWORD: ''

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gadyuka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gadyuka}
      # Runtime role of the app (deploy/postgres/initdb/10-app-role.sh)
      APP_DB_USER: ${APP_DB_USER:-gadyuka_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Loopback only: `docker compose build app` connects here (build network: host).
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb
    logging: *logging

  minio:
    image: *minio-image
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      # No web console in production (use `mc` inside the container, DEPLOY.md).
      MINIO_BROWSER: 'off'
    volumes:
      - minio_data:/data
    # Not published on the host: the image build never reads media (pages only carry /media/… URLs),
    # the app and the seed reach MinIO over the compose network.
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  # Idempotent, runs on every `docker compose up`: bucket (private) + the app's MinIO user with a
  # policy limited to that bucket (get / put / delete objects, list it).
  minio-init:
    image: *minio-image
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-gadyuka-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/app-media-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"], "Resource": ["arn:aws:s3:::$$S3_BUCKET"] },
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"] }
          ]
        }
        EOF
        mc admin policy create local app-media /tmp/app-media-policy.json
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        case "$$(mc admin user info local "$$S3_ACCESS_KEY_ID" --json)" in
          *app-media*) echo "policy app-media is attached to $$S3_ACCESS_KEY_ID" ;;
          *) mc admin policy attach local app-media --user "$$S3_ACCESS_KEY_ID" ;;
        esac
    logging: *logging

  app:
    build:
      context: .
      target: runner
      # `next build` prerenders pages from the DB → it must reach db on 127.0.0.1.
      network: host
      secrets:
        - dotenv
    image: gadyuka-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Least-privilege role (no DDL, no superuser): a SQL-level bug cannot escalate.
      DATABASE_URL: postgresql://${APP_DB_USER:-gadyuka_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-gadyuka}?schema=public
      # The app never gets the superuser password (env_file would pass it through).
      POSTGRES_PASSWORD: ''
      # Migrations need DDL rights → they run in `tools` as POSTGRES_USER (DEPLOY.md, 8 / 9).
      SKIP_MIGRATIONS: '1'
      # Fail at `docker compose up` instead of storing reversible IP hashes.
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT in .env (openssl rand -hex 32)}
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      <<: *s3-env
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/robots.txt || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  tools:
    profiles: ['tools']
    build:
      context: .
      target: tools
    image: gadyuka-tools:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gadyuka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gadyuka}?schema=public
      # The seed uploads its images to MinIO (prisma/seed/media.ts).
      <<: *s3-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging: *logging

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:

secrets:
  # .env is mounted into the build step only (Dockerfile: --mount=type=secret,id=dotenv).
  dotenv:
    file: ./.env
